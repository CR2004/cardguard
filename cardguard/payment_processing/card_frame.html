<!doctype html>
<html><head><meta charset="utf-8"><title>Card</title>
<style>
  body{margin:0;font:14px system-ui;background:#fff}
  .f{display:grid;grid-template-columns:2fr 1fr 1fr;gap:6px;padding:6px}
  input{padding:8px;border:1px solid #bbb;border-radius:6px;font:inherit}
  #status{grid-column:1/4;color:#666;font-size:12px;display:flex;align-items:center;gap:8px;min-height:22px}
  #confirm{display:none;padding:4px 10px;border-radius:6px;border:1px solid #1b1b1f;background:#1b1b1f;color:#fff;font:inherit;cursor:pointer}
  b{color:#1b1b1f}
</style></head>
<body>
<div class="f">
  <input id="pan" placeholder="Card number (test cards only)" autocomplete="off" inputmode="numeric">
  <input id="exp" placeholder="MM/YY" autocomplete="off">
  <input id="cvc" placeholder="CVC" autocomplete="off" inputmode="numeric">
  <div id="status"><span id="msg">Card details stay in this frame; the store receives only ciphertext.</span>
    <button id="confirm">Confirm</button></div>
</div>
<script src="/card-seal.js"></script>
<script>
  // The amount and merchant are shown HERE, inside the issuer's origin, and sealed only after the
  // buyer confirms them: a store page cannot show one amount and seal another.
  let parentOrigin = null, pendingRequest = null, pendingSource = null;
  const msg = document.getElementById('msg'), confirmBtn = document.getElementById('confirm');
  const keyReady = fetch('/pubkey').then(r => r.json());
  keyReady.then(k => { parentOrigin = k.merchant_origin; });
  // Listen from the first instant: a Buy that arrives before the key is loaded waits for it.
  window.addEventListener('message', async ev => {
      if (!ev.data || ev.data.type !== 'seal') return;
      const k = await keyReady;
      if (ev.origin !== parentOrigin) return;  // only the store may ask
      pendingRequest = { amount_cents: Number(ev.data.amount_cents), merchant_id: String(ev.data.merchant_id) };
      pendingSource = ev.source;
      msg.replaceChildren();
      const b = document.createElement('b');
      b.textContent = `Pay $${(pendingRequest.amount_cents / 100).toFixed(2)} to ${pendingRequest.merchant_id}?`;
      msg.appendChild(b);
      confirmBtn.style.display = 'inline-block';
  });
  keyReady.then(k => {
    confirmBtn.onclick = async () => {
      if (!pendingRequest) return;
      confirmBtn.style.display = 'none';
      try {
        const blob = await cardSeal.seal(k.spki_b64, {
          pan: document.getElementById('pan').value, exp: document.getElementById('exp').value,
          cvc: document.getElementById('cvc').value, amount_cents: pendingRequest.amount_cents,
          merchant_id: pendingRequest.merchant_id }, k.kid);
        msg.textContent = `Sealed $${(pendingRequest.amount_cents / 100).toFixed(2)} to ${pendingRequest.merchant_id}. The store gets ciphertext only.`;
        pendingSource.postMessage({ type: 'sealed', blob }, parentOrigin);
      } catch (e) {
        msg.textContent = 'Could not seal: ' + (e.message || e);
        pendingSource.postMessage({ type: 'seal_error', error: String(e.message || e) }, parentOrigin);
      }
      pendingRequest = null;
    };
  });
</script>
</body></html>
