<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CardGuard Checkout</title>
<script src="https://js.stripe.com/v3/"></script>
<style>
  :root { --bg:#f6f7f9; --card:#fff; --ink:#15181d; --muted:#667085; --line:#e4e7ec;
          --ok:#12805c; --warn:#b54708; --bad:#c01048; --accent:#3538cd; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#0f1115; --card:#181b21; --ink:#eceef2; --muted:#98a2b3; --line:#2a2f38; } }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:15px/1.5 system-ui, sans-serif; }
  main { max-width:1100px; margin:0 auto; padding:24px 16px; display:grid; gap:16px;
         grid-template-columns: minmax(0,380px) minmax(0,1fr); }
  @media (max-width:800px) { main { grid-template-columns:1fr; } }
  section { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:18px; }
  h1 { font-size:18px; margin:0 0 4px; } h2 { font-size:14px; margin:0 0 10px; color:var(--muted);
       text-transform:uppercase; letter-spacing:.04em; }
  label { display:block; font-size:13px; color:var(--muted); margin:12px 0 4px; }
  input, select { width:100%; padding:9px 10px; border:1px solid var(--line); border-radius:8px;
                  background:transparent; color:var(--ink); font:inherit; }
  #card { padding:11px 10px; border:1px solid var(--line); border-radius:8px; }
  button { font:inherit; border:0; border-radius:8px; padding:10px 14px; cursor:pointer;
           background:var(--accent); color:#fff; }
  button.ghost { background:transparent; color:var(--ink); border:1px solid var(--line); }
  .row { display:flex; gap:8px; flex-wrap:wrap; margin-top:12px; }
  .pill { font-size:12px; padding:2px 8px; border-radius:99px; border:1px solid var(--line); }
  .DISCLOSED { color:var(--ok); } .BLOCKED { color:var(--bad); }
  .approved, .approved_by_human { color:var(--ok); } .needs_review { color:var(--warn); }
  .declined, .declined_by_human, .blocked { color:var(--bad); }
  pre { white-space:pre-wrap; word-break:break-word; font-size:12px; margin:0; }
  .entry { border-top:1px solid var(--line); padding:8px 0; }
  .big { font-size:28px; font-weight:700; }
  .muted { color:var(--muted); font-size:13px; }
</style>
</head>
<body>
<main>
  <section>
    <h1>Test Store: Noise-cancelling headphones</h1>
    <div class="muted" id="mode">Loading…</div>

    <label>Amount (USD)</label>
    <input id="amount" type="number" value="20" min="1">
    <label>Buyer country (from IP)</label>
    <select id="country"><option>US</option><option>DE</option><option>BR</option><option>NG</option></select>
    <label>Card (test numbers only, e.g. 4242 4242 4242 4242)</label>
    <div id="card"></div>
    <label><input type="checkbox" id="sabotage" style="width:auto"> Compromise the merchant agent</label>

    <div class="row">
      <button id="buy">Buy</button>
      <button class="ghost" data-preset="normal">Preset: normal</button>
      <button class="ghost" data-preset="risky">Preset: risky</button>
    </div>
    <p id="result" class="muted"></p>
  </section>

  <section>
    <h2>Human review queue</h2>
    <div id="reviews" class="muted">Nothing waiting.</div>
    <h2 style="margin-top:20px">Disclosure ledger</h2>
    <div>Card numbers seen by coordinator: <span class="big" id="seen">0</span></div>
    <div id="ledger"></div>
  </section>
</main>
<script>
let stripe, card, mock = true;

async function init() {
  const cfg = await (await fetch('/config')).json();
  mock = cfg.mock;
  document.getElementById('mode').textContent = mock
    ? 'MOCK mode (no Stripe key set) - card field disabled'
    : 'Stripe TEST mode - no real money moves';
  if (!mock) {
    stripe = Stripe(cfg.publishableKey);
    card = stripe.elements().create('card');
    card.mount('#card');
  } else {
    document.getElementById('card').textContent = 'Mock card (Visa, US)';
  }
  refresh();
}

async function buy() {
  const out = document.getElementById('result');
  out.textContent = 'Agents deciding…';
  let pmId = 'pm_mock_' + Math.random().toString(16).slice(2, 10);
  if (!mock) {
    const { paymentMethod, error } = await stripe.createPaymentMethod({ type: 'card', card });
    if (error) { out.textContent = error.message; return; }
    pmId = paymentMethod.id;   // the card itself never reaches our server
  }
  const res = await (await fetch('/checkout', { method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ payment_method_id: pmId,
      amount_cents: Math.round(+document.getElementById('amount').value * 100),
      buyer_country: document.getElementById('country').value,
      sabotage: document.getElementById('sabotage').checked }) })).json();
  showResult(res);
  refresh();
}

function showResult(res) {
  const out = document.getElementById('result');
  out.className = res.outcome;
  let txt = res.outcome.replace(/_/g, ' ').toUpperCase();
  if (res.verdict) txt += ` (score ${res.verdict.score}: ${res.verdict.cites.join(', ') || 'no risk flags'})`;
  if (res.verdict && res.verdict.jev) {
    const j = res.verdict.jev;
    txt += ` · Jev says ${j.action} (${Math.round(j.confidence * 100)}% conf), rules say ${res.verdict.rules_decision}`;
    if (res.verdict.confidence_gated) txt += ' · low confidence, sent to human';
  } else if (res.verdict) txt += ` · decided by ${res.verdict.decided_by}`;
  if (res.payment) txt += ` - payment ${res.payment.status}${res.payment.id ? ' ' + res.payment.id : ''}${res.payment.reason ? ': ' + res.payment.reason : ''}`;
  if (res.blocked) txt += ` - ${res.blocked.length} leak attempts stopped, no charge`;
  out.textContent = txt;
  if (res.verdict && res.verdict.explanation) {
    const p = document.createElement('div');
    p.style.marginTop = '8px'; p.style.color = 'var(--ink)';
    p.textContent = `"${res.verdict.explanation.text}" - ${res.verdict.explanation.by}`;
    out.appendChild(p);
  }
}

async function act(id, action) {
  const res = await (await fetch(`/reviews/${id}/${action}`, { method: 'POST' })).json();
  showResult(res); refresh();
}

async function refresh() {
  const [led, rev] = await Promise.all([fetch('/ledger').then(r => r.json()), fetch('/reviews').then(r => r.json())]);
  document.getElementById('seen').textContent = led.card_numbers_seen_by_coordinator;
  document.getElementById('ledger').innerHTML = led.entries.slice().reverse().map(e =>
    `<div class="entry"><span class="pill ${e.status}">${e.status}</span> ${e.source} · ${e.purpose}
     <pre>${escape(JSON.stringify(e.fields || e.reason))}</pre></div>`).join('');
  const box = document.getElementById('reviews');
  box.innerHTML = rev.length ? rev.map(r =>
    `<div class="entry">$${(r.amount / 100).toFixed(2)} · score ${r.verdict.score} · ${r.verdict.cites.join(', ')}
     <div class="row"><button onclick="act('${r.id}','approve')">Approve</button>
     <button class="ghost" onclick="act('${r.id}','decline')">Decline</button></div></div>`).join('')
    : 'Nothing waiting.';
}

function escape(s) { return s.replace(/[&<>]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c])); }

document.getElementById('buy').onclick = buy;
document.querySelectorAll('[data-preset]').forEach(b => b.onclick = () => {
  const risky = b.dataset.preset === 'risky';
  document.getElementById('amount').value = risky ? 900 : 20;
  document.getElementById('country').value = risky ? 'DE' : 'US';
});
init();
</script>
</body>
</html>
